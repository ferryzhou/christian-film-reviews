<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  /* Amazon KDP 电子书封面：1600×2560（1:1.6）。纯排版原创，不使用任何影片素材。 */
  html, body { margin: 0; padding: 0; }
  body {
    width: 1600px; height: 2560px; overflow: hidden; position: relative;
    background: #f1e7d0;
    background-image:
      radial-gradient(ellipse 1400px 1100px at 50% 18%, rgba(255, 248, 228, 0.95), rgba(241, 231, 208, 0) 70%),
      radial-gradient(ellipse 1200px 900px at 50% 100%, rgba(120, 92, 40, 0.18), rgba(241, 231, 208, 0) 70%);
    font-family: "Noto Serif CJK SC", "Noto Serif CJK TC", "Noto Serif SC", "Noto Serif TC", "Songti SC", "SimSun", "WenQuanYi Zen Hei", serif;
    color: #2a2418;
  }
  .frame { position: absolute; inset: 70px; border: 3px solid #9a7320; }
  .frame::after { content: ""; position: absolute; inset: 14px; border: 1px solid rgba(154, 115, 32, 0.55); }
  .strip { position: absolute; top: 0; bottom: 0; width: 58px; background: #2a2418; }
  .strip.left { left: 0; } .strip.right { right: 0; }
  .strip span { display: block; width: 26px; height: 40px; margin: 42px auto 0; background: #f1e7d0; border-radius: 4px; }
  .sun { position: absolute; left: 50%; top: 1210px; width: 520px; height: 520px; margin-left: -260px; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #f6d98a 0%, #d9ad4c 55%, #9a7320 100%); box-shadow: 0 0 140px 40px rgba(217, 173, 76, 0.35); }
  .horizon { position: absolute; left: 130px; right: 130px; top: 1470px; height: 480px;
    background: linear-gradient(180deg, #2a2418 0%, #3a3223 60%, #2a2418 100%); }
  .horizon::before { content: ""; position: absolute; left: 0; right: 0; top: -6px; height: 6px; background: #c9a35e; }
  .rays { position: absolute; left: 130px; right: 130px; top: 1950px; height: 330px;
    background: repeating-linear-gradient(90deg, rgba(154,115,32,0.0) 0 22px, rgba(154,115,32,0.22) 22px 24px); opacity: 0.9;
    mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0)); -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,0.9), rgba(0,0,0,0)); }
  .kicker { position: absolute; top: 240px; left: 0; right: 0; text-align: center; font-size: 34px; letter-spacing: 12px; color: #9a7320; }
  .title { position: absolute; top: 380px; left: 0; right: 0; text-align: center; font-size: 236px; font-weight: 700; letter-spacing: 14px; line-height: 1.12; }
  .rule { position: absolute; left: 50%; top: 1005px; width: 220px; height: 4px; margin-left: -110px; background: #9a7320; }
  .subtitle { position: absolute; top: 1060px; left: 0; right: 0; text-align: center; font-size: 78px; letter-spacing: 10px; color: #5a5040; }
  .tagline { position: absolute; top: 1680px; left: 0; right: 0; text-align: center; font-size: 46px; letter-spacing: 6px; color: #e9d7a6; }
  .author { position: absolute; top: 2330px; left: 0; right: 0; text-align: center; font-size: 62px; letter-spacing: 16px; color: #2a2418; }
</style>
</head>
<body>
  <div class="strip left">{{HOLES}}</div>
  <div class="strip right">{{HOLES}}</div>
  <div class="frame"></div>
  <div class="kicker">✦ 电影随笔集 ✦</div>
  <div class="title">{{TITLE}}</div>
  <div class="rule"></div>
  <div class="subtitle">{{SUBTITLE}}</div>
  <div class="sun"></div>
  <div class="horizon"></div>
  <div class="tagline">{{TAGLINE}}</div>
  <div class="rays"></div>
  <div class="author">{{AUTHOR}}</div>
</body>
</html>
